[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatch 构建配置
[tool.hatch.build.targets.wheel]
packages = ["quant"]

[project]
name = "my_first_quant"
version = "0.1.0"
description = "A股量化交易框架"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "peng" }
]
keywords = ["quant", "trading", "alpha", "backtest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

# 核心依赖
dependencies = [
    # 数据处理
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",

    # 数据库
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",

    # 数据源
    "tushare>=1.3.0",
    "akshare>=1.10.0",

    # 配置管理
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",

    # 日志
    "loguru>=0.7.0",

    # 任务调度
    "apscheduler>=3.10.0",

    # 工具
    "tqdm>=4.65.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
# 机器学习
ml = [
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
]

# 深度学习
dl = [
    "torch>=2.0.0",
]

# 强化学习
rl = [
    "stable-baselines3>=2.0.0",
    "gymnasium>=0.29.0",
]

# 开发工具
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.5.0",
]

# 可视化
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
]

# 全部依赖
all = [
    "quant[ml,dl,rl,dev,viz]",
]

[project.scripts]
quant = "quant.cli:main"

[project.urls]
Homepage = "https://github.com/peng/my_first_quant"

# ============== Ruff 配置 ==============
[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.isort]
known-first-party = ["quant"]

# ============== Black 配置 ==============
[tool.black]
line-length = 100
target-version = ["py312"]

# ============== Pytest 配置 ==============
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# ============== MyPy 配置 ==============
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# ============== Coverage 配置 ==============
[tool.coverage.run]
source = ["quant"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
